; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]          ; סביבה (Environment) בשם esp32dev
platform = espressif32  ; איזו פלטפורמה (פה: ESP32 של Espressif)
board = esp32dev        ; איזה לוח ספציפי (פה: Dev Module גנרי)
framework = arduino     ; באיזה Framework לעבוד (פה: Arduino)
monitor_speed = 115200

lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7
  ESP32 WebServer

; סביבה מיוחדת להרצת קובץ הכיול בלבד
[env:calib]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<../calib/moisture_setup.cpp>

; סביבה מיוחדת לבדיקת המשאבה וה-MOSFET דרך הטרמינל
[env:pump_setup]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<../calib/pump_setup.cpp>